services:
  inventorymanagement.db:
      image: postgres:16
      restart: always
      environment:
          POSTGRES_DB: inventorymanagementdb
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin123
      ports:
        - "5432:5432"
      volumes:
        - "inventorymanagementdata:/var/lib/postgresql/data"

volumes:
  inventorymanagementdata: